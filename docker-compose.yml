services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: softifycron
      MYSQL_USER: softify
      MYSQL_PASSWORD: softify
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - softify_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usoftify", "-psoftify"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  softify_mysql:
